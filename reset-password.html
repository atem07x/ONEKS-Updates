<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONEKS — Yeni Şifre</title><style>body{font-family:Segoe UI,sans-serif;background:#071019;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(390px,88vw);background:#111d27;padding:32px;border-radius:18px;border:1px solid #274055}h1{color:#ff8a00}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:12px;border-radius:9px;border:1px solid #385166;background:#0b151e;color:#fff}button{background:#e87500;border:0;font-weight:700;cursor:pointer}#mesaj{min-height:24px;color:#9fc7e8}</style></head><body><main class="card"><h1>ONEKS</h1><h2>Yeni şifreni belirle</h2><input id="s1" type="password" placeholder="Yeni şifre"><input id="s2" type="password" placeholder="Yeni şifre (tekrar)"><button id="kaydet">Şifreyi Güncelle</button><p id="mesaj"></p></main><script>const URL='https://zfhavcvfsxcvwntixrfj.supabase.co',KEY='sb_publishable_R2iUy0CeT5fqHi3C-PcTuQ_n804CIS1';const p=new URLSearchParams(location.hash.slice(1)),token=p.get('access_token'),m=document.querySelector('#mesaj');kaydet.onclick=async()=>{const a=s1.value,b=s2.value;if(a!==b){m.textContent='Şifreler eşleşmiyor.';return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(a)){m.textContent='En az 8 karakter, büyük/küçük harf ve sayı kullan.';return}if(!token){m.textContent='Bağlantı geçersiz veya süresi dolmuş.';return}const r=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});m.textContent=r.ok?'Şifren güncellendi. ONEKS’e dönebilirsin.':'İşlem yapılamadı; yeni bağlantı iste.'};</script></body></html>
